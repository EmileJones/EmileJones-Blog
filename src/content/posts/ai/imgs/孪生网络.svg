<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 380" width="460" height="380" style="background:#fff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; font-size:13px;">
  <defs>
    <!-- 修正 marker：标准方向沿 X 轴正向指向右 (10, 5) -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" />
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; rx: 4; }
      .text { text-anchor: middle; dominant-baseline: central; fill: #1e293b; }
      .line { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 4,4; }
    </style>
  </defs>

  <!-- 节点 -->
  <rect class="box" x="50" y="20" width="110" height="36"/>
  <text class="text" x="105" y="38">输入 A</text>

  <rect class="box" x="300" y="20" width="110" height="36"/>
  <text class="text" x="355" y="38">输入 B</text>

  <rect class="box" x="50" y="85" width="110" height="36"/>
  <text class="text" x="105" y="103">Encoder fθ</text>

  <rect class="box" x="300" y="85" width="110" height="36"/>
  <text class="text" x="355" y="103">Encoder fθ</text>

  <rect class="box" x="50" y="150" width="110" height="36"/>
  <text class="text" x="105" y="168">向量 A</text>

  <rect class="box" x="300" y="150" width="110" height="36"/>
  <text class="text" x="355" y="168">向量 B</text>

  <rect class="box" x="150" y="215" width="160" height="36"/>
  <text class="text" x="230" y="233">计算距离 (L2 等)</text>

  <rect class="box" x="165" y="275" width="130" height="36"/>
  <text class="text" x="230" y="293">阈值判断</text>

  <rect class="box" x="165" y="335" width="130" height="36"/>
  <text class="text" x="230" y="353">同一人 / 不同人</text>

  <!-- 垂直连线：输入 -> Encoder -->
  <line class="line" x1="105" y1="56" x2="105" y2="85"/>
  <line class="line" x1="355" y1="56" x2="355" y2="85"/>

  <!-- 共享参数关联虚线 -->
  <line class="dash" x1="160" y1="103" x2="300" y2="103"/>
  <text class="text" x="230" y="93" fill="#64748b" font-size="11">共享同一组参数</text>

  <!-- 垂直连线：Encoder -> 向量 -->
  <line class="line" x1="105" y1="121" x2="105" y2="150"/>
  <line class="line" x1="355" y1="121" x2="355" y2="150"/>

  <!-- 折线汇入：向量 -> 计算距离上边框 -->
  <path class="line" d="M 105 186 L 105 200 L 190 200 L 190 215"/>
  <path class="line" d="M 355 186 L 355 200 L 270 200 L 270 215"/>

  <!-- 判定与结果连线 -->
  <line class="line" x1="230" y1="251" x2="230" y2="275"/>
  <line class="line" x1="230" y1="311" x2="230" y2="335"/>
</svg>
